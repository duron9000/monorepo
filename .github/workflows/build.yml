name: Precise Build Quilibrium (Full Dependency Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      # 1. 安装缺少的 C++ 编译环境和加密依赖库
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # 2. 编译 Ferret 库
      - name: Build Ferret Library
        run: |
          # 修复可能存在的 git 权限问题
          git config --global --add safe.directory "*"
          
          cd crates/ferret
          # 这里会自动调用 gcc/g++ 编译 C++ 桥接代码
          cargo build --release
          
          mkdir -p ../../node/lib/linux-amd64/
          cp target/release/libferret.a ../../node/lib/linux-amd64/
          echo "Successfully built libferret.a"

      # 3. 编译 Go 节点
      - name: Build Go Node
        run: |
          cd node
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -lferret -lssl -lcrypto -lm -ldl -lpthread"
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: quilibrium-v2.1.0.18-final
          path: node/qnode-linux-amd64
