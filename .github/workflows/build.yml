name: Quilibrium Ultimate Build (Path Auto-Discovery)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      # 1. 安装基础环境
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config git libboost-all-dev

      # 2. 编译并安装 EMP (使用动态路径搜索)
      - name: Build and Install EMP Toolkit
        run: |
          # 编译 emp-tool
          rm -rf emp-tool-src
          git clone https://github.com/emp-toolkit/emp-tool.git emp-tool-src
          cd emp-tool-src && cmake . -DBUILD_SHARED_LIBS=OFF && make -j$(nproc) && sudo make install && cd ..
          
          # 编译 emp-ot
          rm -rf emp-ot-src
          git clone https://github.com/emp-toolkit/emp-ot.git emp-ot-src
          cd emp-ot-src && cmake . -DBUILD_SHARED_LIBS=OFF && make -j$(nproc) && sudo make install && cd ..

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. 编译 Rust 静态库 (动态定位 .a 文件)
      - name: Build Ferret Library
        run: |
          cd crates/ferret
          
          # 动态搜索刚才安装的 libemp-tool.a 和 libemp-ot.a
          # 考虑到可能在 /usr/local/lib 或 /usr/local/lib64
          EMP_TOOL_A=$(sudo find /usr/local/lib /usr/lib -name "libemp-tool.a" | head -n 1)
          EMP_OT_A=$(sudo find /usr/local/lib /usr/lib -name "libemp-ot.a" | head -n 1)
          
          if [ -z "$EMP_TOOL_A" ] || [ -z "$EMP_OT_A" ]; then
            echo "Error: Could not find EMP static libraries!"
            exit 1
          fi
          
          echo "Found libemp-tool at: $EMP_TOOL_A"
          echo "Found libemp-ot at: $EMP_OT_A"
          
          # 物理拷贝到当前目录以供 Rust 链接
          cp "$EMP_TOOL_A" .
          cp "$EMP_OT_A" .
          
          # 设置链接环境变量
          export RUSTFLAGS="-L native=$(pwd)"
          export LIBRARY_PATH="$(pwd):/usr/local/lib"
          cargo build --release
          
          # 准备 Go 的库目录
          mkdir -p ../../node/lib/linux-amd64/
          cp target/release/libferret.a ../../node/lib/linux-amd64/

      # 4. 最终编译 Go 节点
      - name: Build Go Node
        run: |
          cd node
          # 再次确认库文件路径
          LIB_DIR=$(pwd)/lib/linux-amd64
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L$LIB_DIR -L/usr/local/lib -lferret -lemp-tool -lemp-ot -lssl -lcrypto -lm -ldl -lpthread -lstdc++"
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: qnode-v2.1.0.18-final
          path: node/qnode-linux-amd64
