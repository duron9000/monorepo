name: Quilibrium Final Build (No Path Conflict)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config git libboost-all-dev

      # 1. 顺序安装 EMP-Toolkit (使用唯一目录名避开 128 错误)
      - name: Install EMP Toolkit
        run: |
          # A. 安装 emp-tool
          rm -rf emp-tool-repo
          git clone https://github.com/emp-toolkit/emp-tool.git emp-tool-repo
          cd emp-tool-repo
          cmake . -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc)
          sudo make install
          cd ..
          
          # B. 安装 emp-ot
          rm -rf emp-ot-repo
          git clone https://github.com/emp-toolkit/emp-ot.git emp-ot-repo
          cd emp-ot-repo
          cmake . -DBUILD_SHARED_LIBS=OFF -DCMAKE_PREFIX_PATH=/usr/local
          make -j$(nproc)
          sudo make install
          cd ..
          
          sudo ldconfig

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 2. 编译 Rust 静态库
      - name: Build Ferret Library
        run: |
          cd crates/ferret
          export LIBRARY_PATH="/usr/local/lib:$LIBRARY_PATH"
          export CPATH="/usr/local/include"
          cargo build --release
          
          mkdir -p ../../node/lib/linux-amd64/
          cp target/release/libferret.a ../../node/lib/linux-amd64/

      # 3. 最终编译 Go 节点
      - name: Build Go Node
        run: |
          cd node
          export CGO_ENABLED=1
          # 显式链接所有底层 C++ 库
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -L/usr/local/lib -lferret -lemp-tool -lemp-ot -lssl -lcrypto -lm -ldl -lpthread -lstdc++"
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: qnode-v2.1.0.18-standalone
          path: node/qnode-linux-amd64
