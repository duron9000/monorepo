name: Quilibrium Build - Direct build.rs Override

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      # 1. 安装系统底层依赖
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config git libboost-all-dev

      # 2. 顺序安装 EMP-Toolkit (物理路径安装)
      - name: Install EMP Toolkit
        run: |
          # 安装 emp-tool
          rm -rf emp-tool-repo
          git clone https://github.com/emp-toolkit/emp-tool.git emp-tool-repo
          cd emp-tool-repo && cmake . -DBUILD_SHARED_LIBS=OFF && make -j$(nproc) && sudo make install && cd ..
          
          # 安装 emp-ot
          rm -rf emp-ot-repo
          git clone https://github.com/emp-toolkit/emp-ot.git emp-ot-repo
          cd emp-ot-repo && cmake . -DBUILD_SHARED_LIBS=OFF -DCMAKE_PREFIX_PATH=/usr/local && make -j$(nproc) && sudo make install && cd ..
          
          # 刷新库索引
          sudo ldconfig
          
          # 验证库文件存在
          echo "=== Checking installed libraries ==="
          ls -la /usr/local/lib/libemp*.a
          ls -la /usr/local/include/emp-tool/ | head -10

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. 完全重写 ferret 的 build.rs 文件
      - name: Override ferret build.rs with library paths
        run: |
          cd crates/ferret
          
          # 备份原始 build.rs
          cp build.rs build.rs.original
          
          # 创建新的 build.rs，添加所有必要的库搜索路径
          cat > build.rs << 'EOFBUILD'
          fn main() {
              // 添加库搜索路径 - 告诉 rustc 在这些位置查找库
              println!("cargo:rustc-link-search=native=/usr/local/lib");
              println!("cargo:rustc-link-search=native=/usr/lib");
              println!("cargo:rustc-link-search=native=/usr/lib/x86_64-linux-gnu");
              
              // 显式链接所需的静态库
              println!("cargo:rustc-link-lib=static=emp-tool");
              println!("cargo:rustc-link-lib=static=emp-ot");
              
              // 链接系统依赖库
              println!("cargo:rustc-link-lib=ssl");
              println!("cargo:rustc-link-lib=crypto");
              println!("cargo:rustc-link-lib=stdc++");
              println!("cargo:rustc-link-lib=pthread");
              println!("cargo:rustc-link-lib=m");
              println!("cargo:rustc-link-lib=dl");
              
              // 重新运行条件
              println!("cargo:rerun-if-changed=build.rs");
          }
          EOFBUILD
          
          # 显示新的 build.rs 内容
          echo "=== New build.rs content ==="
          cat build.rs

      # 4. 编译 Rust 静态库
      - name: Build Ferret Library
        run: |
          cd crates/ferret
          
          # 设置环境变量
          export RUSTFLAGS="-L native=/usr/local/lib -C link-args=-Wl,-rpath,/usr/local/lib"
          export LIBRARY_PATH="/usr/local/lib:/usr/lib:/usr/lib/x86_64-linux-gnu:$LIBRARY_PATH"
          export LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          export CPATH="/usr/local/include"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"
          
          # 清理之前的编译产物
          cargo clean
          
          # 使用 verbose 模式编译
          cargo build --release --verbose
          
          # 复制生成的库
          mkdir -p ../../node/lib/linux-amd64/
          cp target/release/libferret.a ../../node/lib/linux-amd64/
          
          # 验证生成的库
          echo "=== Generated library ==="
          ls -lh ../../node/lib/linux-amd64/libferret.a
          file ../../node/lib/linux-amd64/libferret.a

      # 5. 最终编译 Go 节点
      - name: Build Go Node
        run: |
          cd node
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -L/usr/local/lib -lferret -lemp-tool -lemp-ot -lssl -lcrypto -lm -ldl -lpthread -lstdc++"
          export CGO_CFLAGS="-I/usr/local/include"
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go
          
          # 验证生成的可执行文件
          echo "=== Generated binary ==="
          ls -lh qnode-linux-amd64
          file qnode-linux-amd64

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: qnode-v2.1.0.18-standalone
          path: node/qnode-linux-amd64
