name: Quilibrium Build Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config git libgmp-dev

      - name: Install Relic Toolkit with GMP preset
        run: |
          # 清理可能存在的旧目录
          rm -rf relic
          
          git clone https://github.com/relic-toolkit/relic.git
          cd relic
          mkdir -p build && cd build
          
          # 使用 gmp-pbc-bn254 的配置（使用 GMP 算术后端，更通用）
          ../preset/gmp-pbc-bn254.sh ..
          
          make -j$(nproc)
          sudo make install
          cd ../..
          sudo ldconfig

      - name: Install EMP Toolkit
        run: |
          # 清理可能存在的旧目录
          rm -rf emp-tool emp-ot
          
          # 安装 emp-tool (header-only)
          git clone https://github.com/emp-toolkit/emp-tool.git
          cd emp-tool
          cmake . -DCMAKE_BUILD_TYPE=Release
          sudo make install  # This only installs headers
          cd ..
          
          # 安装 emp-ot (header-only)
          git clone https://github.com/emp-toolkit/emp-ot.git
          cd emp-ot
          cmake . -DCMAKE_BUILD_TYPE=Release
          sudo make install  # This only installs headers
          cd ..
          
          echo "=== Verifying EMP headers and relic library ==="
          ls -la /usr/local/include/emp-tool/ | head -10
          ls -la /usr/local/include/emp-ot/ | head -10
          ls -la /usr/local/lib/librelic*.a

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Patch ferret build.rs
        run: |
          cd crates/ferret
          echo "=== Original build.rs (first 40 lines) ==="
          head -n 40 build.rs
          
          cat > build_prepend.txt << 'EOF'
              // === PATCHED: Add library search paths ===
              // Note: emp-tool and emp-ot are header-only libraries
              // We only need to link the underlying dependencies
              println!("cargo:rustc-link-search=native=/usr/local/lib");
              println!("cargo:rustc-link-search=native=/usr/lib");
              println!("cargo:rustc-link-search=native=/usr/lib/x86_64-linux-gnu");
              
              // Link relic (required by EMP toolkit)
              println!("cargo:rustc-link-lib=static=relic_s");
              
              // Link system libraries
              println!("cargo:rustc-link-lib=ssl");
              println!("cargo:rustc-link-lib=crypto");
              println!("cargo:rustc-link-lib=gmp");
              println!("cargo:rustc-link-lib=stdc++");
              println!("cargo:rustc-link-lib=pthread");
              println!("cargo:rustc-link-lib=m");
              println!("cargo:rustc-link-lib=dl");
              // === END PATCH ===
          
          EOF
          
          awk '/^fn main\(\) \{$/ {print; system("cat build_prepend.txt"); next} 1' build.rs > build.rs.new
          mv build.rs.new build.rs
          
          echo "=== Patched build.rs (first 60 lines) ==="
          head -n 60 build.rs

      - name: Build Ferret Library
        run: |
          cd crates/ferret
          export RUSTFLAGS="-L native=/usr/local/lib"
          export LIBRARY_PATH="/usr/local/lib:/usr/lib:/usr/lib/x86_64-linux-gnu:$LIBRARY_PATH"
          export LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          export CPATH="/usr/local/include"
          export C_INCLUDE_PATH="/usr/local/include"
          export CPLUS_INCLUDE_PATH="/usr/local/include"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"
          cargo clean
          cargo build --release --verbose
          mkdir -p ../../node/lib/linux-amd64/
          cp target/release/libferret.a ../../node/lib/linux-amd64/
          echo "=== Generated library ==="
          ls -lh ../../node/lib/linux-amd64/libferret.a

      - name: Build Go Node
        run: |
          cd node
          export CGO_ENABLED=1
          # Note: emp-tool and emp-ot are header-only, only link relic and system libs
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -L/usr/local/lib -lferret -lrelic_s -lssl -lcrypto -lgmp -lm -ldl -lpthread -lstdc++"
          export CGO_CFLAGS="-I/usr/local/include"
          export GOTOOLCHAIN=local
          go mod download
          go build -v -o qnode-linux-amd64 main.go
          echo "=== Generated binary ==="
          ls -lh qnode-linux-amd64

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: qnode-v2.1.0.18-standalone
          path: node/qnode-linux-amd64
