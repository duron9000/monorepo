name: Remote Build Quilibrium Node (Final Fix)

on:
  workflow_dispatch:

jobs:
  build-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Original Repository
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build Quilibrium Node
        working-directory: ./node
        run: |
          go mod download
          
          # 1. 明确 CGO 开启
          export CGO_ENABLED=1
          
          # 2. 关键：手动指定静态库的搜索路径
          # 在 v2.1.0.18 中，库文件位于 node/lib/linux-amd64
          # 我们需要将这个绝对路径传递给链接器
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -lferret -lm -ldl"
          
          # 3. 执行编译
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quilibrium-v2.1.0.18-linux
          path: node/qnode-linux-amd64
