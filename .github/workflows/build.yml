name: Full Build Quilibrium (Final Linker Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      # 1. 安装系统依赖
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config git libboost-all-dev

      # 2. 安装 EMP-Toolkit (强制生成静态库并刷新 ldconfig)
      - name: Install EMP-Toolkit
        run: |
          # 安装 emp-tool
          rm -rf emp-tool
          git clone https://github.com/emp-toolkit/emp-tool.git
          cd emp-tool && cmake . -DBUILD_SHARED_LIBS=OFF && make -j$(nproc) && sudo make install && cd ..
          
          # 安装 emp-ot
          rm -rf emp-ot
          git clone https://github.com/emp-toolkit/emp-ot.git
          cd emp-ot && cmake . -DBUILD_SHARED_LIBS=OFF && make -j$(nproc) && sudo make install && cd ..
          
          # 刷新系统库缓存
          sudo ldconfig

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. 编译 Rust 静态库 (核心修复：增加 LIBRARY_PATH)
      - name: Build Ferret Library
        run: |
          cd crates/ferret
          # 告诉 Rust 在哪里寻找 emp-tool.a 和 emp-ot.a
          export LIBRARY_PATH="/usr/local/lib:$LIBRARY_PATH"
          export CPATH="/usr/local/include"
          
          cargo build --release
          
          mkdir -p ../../node/lib/linux-amd64/
          cp target/release/libferret.a ../../node/lib/linux-amd64/

      # 4. 编译 Go 节点
      - name: Build Go Node
        run: |
          cd node
          export CGO_ENABLED=1
          # 链接所有相关路径
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -L/usr/local/lib -lferret -lemp-tool -lemp-ot -lssl -lcrypto -lm -ldl -lpthread -lstdc++"
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: quilibrium-v2.1.0.18-final
          path: node/qnode-linux-amd64
