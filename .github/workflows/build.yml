name: Quilibrium Ultimate Build (Linker Force Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      # 1. 环境准备
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config git libboost-all-dev

      # 2. 编译并物理定位 EMP 静态库
      - name: Build and Locate EMP Libraries
        run: |
          # 编译 emp-tool
          git clone https://github.com/emp-toolkit/emp-tool.git
          cd emp-tool && cmake . -DBUILD_SHARED_LIBS=OFF && make -j$(nproc) && sudo make install && cd ..
          
          # 编译 emp-ot
          git clone https://github.com/emp-toolkit/emp-ot.git
          cd emp-ot && cmake . -DBUILD_SHARED_LIBS=OFF && make -j$(nproc) && sudo make install && cd ..

          # 【关键点】强制将生成的 .a 文件拷贝到 ferret 源码目录
          # 这样 Rust 编译时在当前目录及其搜索路径下绝对能找到它们
          mkdir -p crates/ferret/lib
          cp /usr/local/lib/libemp-tool.a crates/ferret/
          cp /usr/local/lib/libemp-ot.a crates/ferret/
          # 有些版本可能需要加 lib 前缀或去掉，我们多备一份
          cp /usr/local/lib/libemp-tool.a crates/ferret/libemp-tool.a
          cp /usr/local/lib/libemp-ot.a crates/ferret/libemp-ot.a

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. 编译 Rust 静态库
      - name: Build Ferret Library
        run: |
          cd crates/ferret
          # 告诉 Rust 在当前目录和系统目录找库
          export RUSTFLAGS="-L native=$(pwd) -L native=/usr/local/lib"
          export LIBRARY_PATH="$(pwd):/usr/local/lib"
          cargo build --release
          
          mkdir -p ../../node/lib/linux-amd64/
          cp target/release/libferret.a ../../node/lib/linux-amd64/

      # 4. 编译 Go 节点
      - name: Build Go Node
        run: |
          cd node
          export CGO_ENABLED=1
          # Go 链接阶段也需要这些 C++ 静态库
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -L/usr/local/lib -lferret -lemp-tool -lemp-ot -lssl -lcrypto -lm -ldl -lpthread -lstdc++"
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: qnode-v2.1.0.18-standalone
          path: node/qnode-linux-amd64
