name: Full Build Quilibrium (Final Robust Version)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      # 1. 安装系统依赖
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config git libboost-all-dev

      # 2. 安装 EMP-Toolkit (增加清理逻辑避免 128 错误)
      - name: Install EMP-Toolkit
        run: |
          # 清理并安装 emp-tool
          rm -rf emp-tool
          git clone https://github.com/emp-toolkit/emp-tool.git
          cd emp-tool && cmake . && make -j$(nproc) && sudo make install && cd ..
          
          # 清理并安装 emp-ot
          rm -rf emp-ot
          git clone https://github.com/emp-toolkit/emp-ot.git
          cd emp-ot && cmake . && make -j$(nproc) && sudo make install && cd ..

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. 编译 Rust 静态库
      - name: Build Ferret Library
        run: |
          cd crates/ferret
          export CPATH="/usr/local/include"
          export LIBRARY_PATH="/usr/local/lib"
          cargo build --release
          
          # 创建 node 需要的库目录
          mkdir -p ../../node/lib/linux-amd64/
          cp target/release/libferret.a ../../node/lib/linux-amd64/

      # 4. 编译 Go 节点
      - name: Build Go Node
        run: |
          cd node
          export CGO_ENABLED=1
          # 注意：增加 -lrelic (如果 emp 依赖它) 和 -lstdc++
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -lferret -lssl -lcrypto -lm -ldl -lpthread -lstdc++"
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: quilibrium-v2.1.0.18-standalone
          path: node/qnode-linux-amd64
