name: Quilibrium Build Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config git libgmp-dev

      - name: Install Relic Toolkit with GMP preset
        run: |
          rm -rf relic
          git clone https://github.com/relic-toolkit/relic.git
          cd relic
          mkdir -p build && cd build
          ../preset/gmp-pbc-bn254.sh ..
          make -j$(nproc)
          sudo make install
          cd ../..
          sudo ldconfig

      - name: Install EMP Toolkit
        run: |
          rm -rf emp-tool emp-ot
          git clone https://github.com/emp-toolkit/emp-tool.git
          cd emp-tool
          cmake . -DCMAKE_BUILD_TYPE=Release
          sudo make install
          cd ..
          
          git clone https://github.com/emp-toolkit/emp-ot.git
          cd emp-ot
          cmake . -DCMAKE_BUILD_TYPE=Release
          sudo make install
          cd ..
          
          echo "=== Verifying EMP headers and relic library ==="
          ls -la /usr/local/include/emp-tool/ | head -10
          ls -la /usr/local/include/emp-ot/ | head -10
          ls -la /usr/local/lib/librelic*.a

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'  # 更新到项目要求的版本

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Patch ferret build.rs to remove emp-tool/emp-ot links
        run: |
          cd crates/ferret
          
          echo "=== Original build.rs ==="
          cat build.rs
          echo "=== END Original ==="
          
          # 直接删除或注释掉要求链接 emp-tool 和 emp-ot 的行
          # 这些库不存在，因为它们是 header-only
          sed -i 's/println!("cargo:rustc-link-lib=static=emp-tool");/\/\/ println!("cargo:rustc-link-lib=static=emp-tool"); \/\/ Commented: header-only/' build.rs
          sed -i 's/println!("cargo:rustc-link-lib=static=emp-ot");/\/\/ println!("cargo:rustc-link-lib=static=emp-ot"); \/\/ Commented: header-only/' build.rs
          sed -i 's/println!("cargo:rustc-link-lib=emp-tool");/\/\/ println!("cargo:rustc-link-lib=emp-tool"); \/\/ Commented: header-only/' build.rs
          sed -i 's/println!("cargo:rustc-link-lib=emp-ot");/\/\/ println!("cargo:rustc-link-lib=emp-ot"); \/\/ Commented: header-only/' build.rs
          
          # 如果 build.rs 没有搜索路径，添加它们
          # 在 fn main() 后面添加
          if ! grep -q "cargo:rustc-link-search=native=/usr/local/lib" build.rs; then
            echo "Adding link search paths..."
            # 在第一个 println! 之前插入搜索路径
            sed -i '0,/println!/{s/println!/println!("cargo:rustc-link-search=native=\/usr\/local\/lib");\n    println!("cargo:rustc-link-search=native=\/usr\/lib");\n    &/}' build.rs
          fi
          
          echo "=== Patched build.rs ==="
          cat build.rs
          echo "=== END Patched ==="

      - name: Build All Rust Crypto Libraries
        run: |
          # 定义需要编译的所有 Rust 模块
          CRATES=("bls48581" "bulletproofs" "channel" "ferret" "rpm" "vdf" "verenc")
          
          mkdir -p node/lib/linux-amd64/
          
          export LIBRARY_PATH="/usr/local/lib:/usr/lib:/usr/lib/x86_64-linux-gnu:$LIBRARY_PATH"
          export CPATH="/usr/local/include"
          
          for CRATE in "${CRATES[@]}"; do
            echo "=== Building $CRATE ==="
            cd "crates/$CRATE"
            
            # 清理并针对发布版本编译
            cargo clean
            cargo build --release --verbose
            
            # 搜索生成的静态库文件
            LIB_PATH=$(find target/release -maxdepth 1 -name "lib${CRATE}.a" | head -1)
            
            if [ -n "$LIB_PATH" ]; then
              cp "$LIB_PATH" "../../node/lib/linux-amd64/"
              echo "Successfully copied lib${CRATE}.a"
            else
              echo "ERROR: lib${CRATE}.a not found in target/release"
              exit 1
            fi
            cd ../..
          done
          
          echo "=== All libraries prepared ==="
          ls -lh node/lib/linux-amd64/

      - name: Build Go Node
        run: |
          cd node
          export CGO_ENABLED=1
          
          # 核心修复：在 LDFLAGS 中链接所有缺失的库 
          # 注意：顺序可能影响链接，通常 libferret 放在后面
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 \
            -lbls48581 -lbulletproofs -lchannel -lrpm -lvdf -lverenc -lferret \
            -L/usr/local/lib -lrelic_s -lssl -lcrypto -lgmp -lm -ldl -lpthread -lstdc++"
          
          export CGO_CFLAGS="-I/usr/local/include"
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go
          
          echo "=== Generated binary ==="
          ls -lh qnode-linux-amd64
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go
          echo "=== Generated binary ==="
          ls -lh qnode-linux-amd64

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: qnode-v2.1.0.18-standalone
          path: node/qnode-linux-amd64
