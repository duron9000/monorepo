name: Quilibrium Ultimate Build (Direct Source Link)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      # 1. 安装系统底层工具
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config git libboost-all-dev

      # 2. 编译 EMP 并手动提取库文件
      - name: Build EMP and Extract Libraries
        run: |
          # 创建一个专门存放静态库的文件夹
          mkdir -p $(pwd)/static_libs
          
          # 编译 emp-tool (强制静态编译)
          git clone https://github.com/emp-toolkit/emp-tool.git emp-tool-src
          cd emp-tool-src && cmake . -DBUILD_SHARED_LIBS=OFF && make -j$(nproc)
          # 直接从当前目录找 .a 文件
          find . -name "libemp-tool.a" -exec cp {} $(pwd)/../static_libs/ \;
          cd ..
          
          # 编译 emp-ot
          git clone https://github.com/emp-toolkit/emp-ot.git emp-ot-src
          cd emp-ot-src && cmake . -DBUILD_SHARED_LIBS=OFF && make -j$(nproc)
          find . -name "libemp-ot.a" -exec cp {} $(pwd)/../static_libs/ \;
          cd ..
          
          echo "STATIC_LIBS_PATH=$(pwd)/static_libs" >> $GITHUB_ENV
          ls -l $(pwd)/static_libs/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. 编译 Rust 静态库 (指向提取出的目录)
      - name: Build Ferret Library
        run: |
          cd crates/ferret
          
          # 将提取出的库拷贝到 ferret 目录，确保 Rust 绝对能看到
          cp ${{ env.STATIC_LIBS_PATH }}/*.a .
          
          export RUSTFLAGS="-L native=$(pwd)"
          export LIBRARY_PATH="$(pwd):$LIBRARY_PATH"
          export CPATH="/usr/local/include" # emp 的头文件通常还是需要系统路径
          
          cargo build --release
          
          mkdir -p ../../node/lib/linux-amd64/
          cp target/release/libferret.a ../../node/lib/linux-amd64/

      # 4. 最终编译 Go 节点
      - name: Build Go Node
        run: |
          cd node
          # 整合所有提取出的静态库
          mkdir -p ./lib/linux-amd64/
          cp ${{ env.STATIC_LIBS_PATH }}/*.a ./lib/linux-amd64/
          
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -lferret -lemp-tool -lemp-ot -lssl -lcrypto -lm -ldl -lpthread -lstdc++"
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: qnode-v2.1.0.18-standalone
          path: node/qnode-linux-amd64
