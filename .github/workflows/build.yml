name: Quilibrium Sequential Build (Dependency Chain Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config git libboost-all-dev

      # 1. 顺序安装 EMP-Toolkit
      - name: Install EMP Toolkit (Sequential)
        run: |
          # A. 安装 emp-tool (基础库)
          git clone https://github.com/emp-toolkit/emp-tool.git
          cd emp-tool
          cmake . -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc)
          sudo make install
          cd ..
          
          # B. 安装 emp-ot (依赖 emp-tool)
          git clone https://github.com/emp-toolkit/emp-ot.git
          cd emp-ot
          # 明确告诉 CMake 去 /usr/local 找上一步安装的东西
          cmake . -DBUILD_SHARED_LIBS=OFF -DCMAKE_PREFIX_PATH=/usr/local
          make -j$(nproc)
          sudo make install
          cd ..
          
          # 刷新动态库缓存（虽然我们用的是静态库，但这是好习惯）
          sudo ldconfig

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 2. 编译 Rust 静态库 (指向系统安装路径)
      - name: Build Ferret Library
        run: |
          cd crates/ferret
          # 此时 libemp-tool.a 和 libemp-ot.a 应该已经在 /usr/local/lib 了
          export LIBRARY_PATH="/usr/local/lib:$LIBRARY_PATH"
          export CPATH="/usr/local/include"
          
          cargo build --release
          
          mkdir -p ../../node/lib/linux-amd64/
          cp target/release/libferret.a ../../node/lib/linux-amd64/

      # 3. 最终编译 Go 节点
      - name: Build Go Node
        run: |
          cd node
          export CGO_ENABLED=1
          # 链接所有路径
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -L/usr/local/lib -lferret -lemp-tool -lemp-ot -lssl -lcrypto -lm -ldl -lpthread -lstdc++"
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: qnode-v2.1.0.18-standalone
          path: node/qnode-linux-amd64
