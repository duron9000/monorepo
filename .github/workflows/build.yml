name: Quilibrium v2.1.0.18 Complete Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Quilibrium Repository
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config git libgmp-dev

      - name: Install Relic Toolkit
        run: |
          rm -rf relic
          git clone https://github.com/relic-toolkit/relic.git
          cd relic
          mkdir -p build && cd build
          ../preset/gmp-pbc-bn254.sh ..
          make -j$(nproc)
          sudo make install
          cd ../..
          sudo ldconfig
          echo "=== Relic installed ==="
          ls -la /usr/local/lib/librelic*.a

      - name: Install EMP Toolkit Headers
        run: |
          rm -rf emp-tool emp-ot
          
          git clone https://github.com/emp-toolkit/emp-tool.git
          cd emp-tool
          cmake . -DCMAKE_BUILD_TYPE=Release
          sudo make install
          cd ..
          
          git clone https://github.com/emp-toolkit/emp-ot.git
          cd emp-ot
          cmake . -DCMAKE_BUILD_TYPE=Release
          sudo make install
          cd ..
          
          echo "=== EMP headers installed ==="
          ls -la /usr/local/include/emp-tool/ | head -5
          ls -la /usr/local/include/emp-ot/ | head -5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Rust Crates for Static Library Generation
        run: |
          echo "=== Configuring crates to generate static libraries ==="
          
          for crate in bls48581 bulletproofs channel vdf verenc rpm; do
            TOML="crates/${crate}/Cargo.toml"
            
            if [ -f "$TOML" ]; then
              echo "Processing $crate..."
              
              # 备份
              cp "$TOML" "${TOML}.backup"
              
              # 检查是否已有 [lib] section
              if grep -q "^\[lib\]" "$TOML"; then
                echo "  [lib] section exists, modifying..."
                # 在 [lib] 后添加 crate-type (如果不存在)
                if ! grep -q "^crate-type" "$TOML"; then
                  sed -i '/^\[lib\]/a crate-type = ["lib", "staticlib"]' "$TOML"
                fi
              else
                echo "  Adding [lib] section..."
                cat >> "$TOML" << EOF

[lib]
crate-type = ["lib", "staticlib"]
EOF
              fi
              
              echo "  Modified $crate:"
              tail -n 3 "$TOML"
            else
              echo "WARNING: $TOML not found!"
            fi
          done

      - name: Patch Ferret build.rs
        run: |
          cd crates/ferret
          
          # 注释掉 emp-tool 和 emp-ot 链接指令（它们是 header-only）
          sed -i 's/println!("cargo:rustc-link-lib=static=emp-tool");/\/\/ &/' build.rs
          sed -i 's/println!("cargo:rustc-link-lib=static=emp-ot");/\/\/ &/' build.rs
          sed -i 's/println!("cargo:rustc-link-lib=emp-tool");/\/\/ &/' build.rs
          sed -i 's/println!("cargo:rustc-link-lib=emp-ot");/\/\/ &/' build.rs
          
          # 添加搜索路径
          if ! grep -q "cargo:rustc-link-search=native=/usr/local/lib" build.rs; then
            sed -i '0,/println!/{s/println!/println!("cargo:rustc-link-search=native=\/usr\/local\/lib");\n    println!("cargo:rustc-link-search=native=\/usr\/lib");\n    &/}' build.rs
          fi
          
          echo "=== Ferret build.rs patched ==="

      - name: Build All Rust Crates
        run: |
          export LIBRARY_PATH="/usr/local/lib:/usr/lib:/usr/lib/x86_64-linux-gnu"
          export LD_LIBRARY_PATH="/usr/local/lib"
          export CPATH="/usr/local/include"
          export C_INCLUDE_PATH="/usr/local/include"
          export CPLUS_INCLUDE_PATH="/usr/local/include"
          
          cargo clean
          cargo build --release --workspace --verbose
          
          echo "=== All .a files generated ==="
          find target/release -name "*.a" -type f
          
          echo "=== Copying libraries to node/lib/linux-amd64/ ==="
          mkdir -p node/lib/linux-amd64/
          
          for crate in ferret bls48581 bulletproofs channel vdf verenc rpm; do
            # 查找库文件（可能带哈希）
            LIB_FILES=$(find target/release -name "lib${crate}*.a" -type f 2>/dev/null)
            
            if [ -n "$LIB_FILES" ]; then
              # 选择最大的文件（通常是完整版本）
              LIB_FILE=$(echo "$LIB_FILES" | xargs ls -S 2>/dev/null | head -1)
              echo "Found $crate: $LIB_FILE"
              cp "$LIB_FILE" "node/lib/linux-amd64/lib${crate}.a"
            else
              echo "WARNING: No library found for $crate"
            fi
          done
          
          echo "=== Final libraries ==="
          ls -lh node/lib/linux-amd64/

      - name: Build Go Node
        run: |
          cd node
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -L/usr/local/lib -lferret -lbls48581 -lbulletproofs -lchannel -lvdf -lverenc -lrpm -lrelic_s -lssl -lcrypto -lgmp -lm -ldl -lpthread -lstdc++"
          export CGO_CFLAGS="-I/usr/local/include"
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go
          
          echo "=== Binary generated ==="
          ls -lh qnode-linux-amd64
          file qnode-linux-amd64

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: qnode-v2.1.0.18-linux-amd64
          path: node/qnode-linux-amd64
