name: Remote Build Quilibrium Node

on:
  workflow_dispatch:

jobs:
  build-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Original Repository
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build Quilibrium Node
        working-directory: ./node
        run: |
          go mod download
          # 关键点：
          # 1. 开启 CGO
          # 2. 这里的参数可能需要根据仓库内静态库的实际位置调整
          # 官方仓库中 linux-amd64 的库通常在 node/lib 目录下
          export CGO_ENABLED=1
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quilibrium-v2.1.0.18-linux
          path: node/qnode-linux-amd64
