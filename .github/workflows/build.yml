name: Precise Build Quilibrium (Rust 1.75+ & Go)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 1. 安装最新的稳定版 Rust (支持 Edition 2021)
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # 2. 编译指定的 ferret 库
      - name: Build Ferret Library
        run: |
          # 直接进入核心库目录，避免 find 报错
          cd crates/ferret
          cargo build --release
          
          # 确保目标目录存在并拷贝静态库
          mkdir -p ../../node/lib/linux-amd64/
          cp target/release/libferret.a ../../node/lib/linux-amd64/
          echo "Successfully built and moved libferret.a"

      # 3. 编译 Go 节点
      - name: Build Go Node
        run: |
          cd node
          export CGO_ENABLED=1
          # 链接到我们刚刚编译出的库
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -lferret -lm -ldl -lpthread"
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: quilibrium-v2.1.0.18-final
          path: node/qnode-linux-amd64
