name: Quilibrium Ultimate Build (Linker Diagnostic Version)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config git libboost-all-dev

      # 1. 强力编译 EMP 核心并进行全盘路径诊断
      - name: Build EMP and Diagnostic Locate
        run: |
          mkdir -p $HOME/compiled_libs
          
          # 编译 emp-tool
          git clone https://github.com/emp-toolkit/emp-tool.git emp-tool-src
          cd emp-tool-src
          cmake . -DBUILD_SHARED_LIBS=OFF -DENABLE_WERROR=OFF
          make -j$(nproc)
          # 搜索所有以 .a 结尾的文件，不管它叫什么
          find . -name "*.a" -exec cp {} $HOME/compiled_libs/ \;
          cd ..
          
          # 编译 emp-ot
          git clone https://github.com/emp-toolkit/emp-ot.git emp-ot-src
          cd emp-ot-src
          cmake . -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc)
          find . -name "*.a" -exec cp {} $HOME/compiled_libs/ \;
          cd ..

          # 打印出到底找到了哪些库文件
          echo "==== Current Compiled Libraries ===="
          ls -F $HOME/compiled_libs/
          echo "===================================="
          echo "LIBS_DIR=$HOME/compiled_libs" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 2. 编译 Rust 静态库 (带容错逻辑)
      - name: Build Ferret Library
        run: |
          cd crates/ferret
          
          # 尝试拷贝库，如果不存在则打印目录内容协助调试
          cp ${{ env.LIBS_DIR }}/*.a . || (ls -R ${{ env.LIBS_DIR }} && exit 1)
          
          export RUSTFLAGS="-L native=$(pwd)"
          export LIBRARY_PATH="$(pwd)"
          
          cargo build --release
          
          mkdir -p ../../node/lib/linux-amd64/
          cp target/release/libferret.a ../../node/lib/linux-amd64/

      # 3. 最终编译 Go 节点
      - name: Build Go Node
        run: |
          cd node
          mkdir -p ./lib/linux-amd64/
          cp ${{ env.LIBS_DIR }}/*.a ./lib/linux-amd64/
          
          export CGO_ENABLED=1
          # 使用通配符链接，减少对具体文件名的依赖
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -lferret -lssl -lcrypto -lm -ldl -lpthread -lstdc++"
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: qnode-v2.1.0.18-final
          path: node/qnode-linux-amd64
