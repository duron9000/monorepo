name: Quilibrium Ultimate Build (Absolute Path Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config git libboost-all-dev

      # 1. 编译 EMP 并使用绝对路径精确提取
      - name: Build EMP and Precise Extract
        run: |
          # 创建绝对路径的存放目录
          mkdir -p $HOME/compiled_libs
          
          # 编译 emp-tool
          git clone https://github.com/emp-toolkit/emp-tool.git emp-tool-src
          cd emp-tool-src && cmake . -DBUILD_SHARED_LIBS=OFF && make -j$(nproc)
          # 搜寻生成的静态库并拷贝
          find $(pwd) -name "libemp-tool.a" -exec cp {} $HOME/compiled_libs/ \;
          cd ..
          
          # 编译 emp-ot
          git clone https://github.com/emp-toolkit/emp-ot.git emp-ot-src
          cd emp-ot-src && cmake . -DBUILD_SHARED_LIBS=OFF && make -j$(nproc)
          find $(pwd) -name "libemp-ot.a" -exec cp {} $HOME/compiled_libs/ \;
          cd ..

          # 验证并导出
          ls -R $HOME/compiled_libs/
          echo "LIBS_DIR=$HOME/compiled_libs" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 2. 编译 Rust 静态库
      - name: Build Ferret Library
        run: |
          cd crates/ferret
          
          # 从环境变量中拷贝库文件
          cp ${{ env.LIBS_DIR }}/libemp-tool.a .
          cp ${{ env.LIBS_DIR }}/libemp-ot.a .
          
          export RUSTFLAGS="-L native=$(pwd)"
          export LIBRARY_PATH="$(pwd)"
          export CPATH="/usr/local/include"
          
          cargo build --release
          
          mkdir -p ../../node/lib/linux-amd64/
          cp target/release/libferret.a ../../node/lib/linux-amd64/

      # 3. 编译 Go 节点
      - name: Build Go Node
        run: |
          cd node
          # 拷贝所有底层库到 node 链接目录
          mkdir -p ./lib/linux-amd64/
          cp ${{ env.LIBS_DIR }}/libemp-tool.a ./lib/linux-amd64/
          cp ${{ env.LIBS_DIR }}/libemp-ot.a ./lib/linux-amd64/
          
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -lferret -lemp-tool -lemp-ot -lssl -lcrypto -lm -ldl -lpthread -lstdc++"
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: qnode-v2.1.0.18-final
          path: node/qnode-linux-amd64
