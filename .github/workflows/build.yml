name: Full Build Quilibrium (Compile Rust + Go)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 1. 安装 Rust 环境（因为 libferret 是用 Rust 写的）
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 2. 编译 Rust 静态库
      - name: Build Ferret Library (Rust)
        run: |
          # 查找包含 ferret 源码的目录并进入
          # 通常路径在 monorepo/lib/ferret 或类似位置
          FERRET_PATH=$(find . -name "Cargo.toml" -exec dirname {} + | head -n 1)
          echo "Building Rust library in $FERRET_PATH"
          cd $FERRET_PATH
          cargo build --release
          
          # 查找生成的 .a 文件并移动到 Go 编译器能找到的地方
          # 默认生成的路径在 target/release/libferret.a
          LIB_FILE=$(find ./target/release -name "libferret.a")
          mkdir -p ../../node/lib/linux-amd64/
          cp $LIB_FILE ../../node/lib/linux-amd64/
          echo "Library moved to node/lib/linux-amd64/"

      # 3. 编译 Go 节点
      - name: Build Go Node
        run: |
          cd node
          export CGO_ENABLED=1
          # 强制指定链接路径
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -lferret -lm -ldl -lpthread"
          # 锁定工具链
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: quilibrium-v2.1.0.18-built-from-source
          path: node/qnode-linux-amd64
