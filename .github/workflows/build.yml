name: Remote Build Quilibrium Node (Final)

on:
  workflow_dispatch:

jobs:
  build-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build
        run: |
          # 1. 强制进入 node 目录
          cd node
          
          # 2. 这里的核心改动：我们直接把 .a 文件拷贝到当前目录，确保链接器百分百能看到
          # 在 v2.1.0.18 中，libferret.a 实际位于 node/lib/linux-amd64/
          mkdir -p ./lib_temp
          cp lib/linux-amd64/libferret.a ./lib_temp/
          
          # 3. 设置 CGO 参数
          export CGO_ENABLED=1
          # 使用 -L. 告诉链接器就在当前临时目录下找
          export CGO_LDFLAGS="-L$(pwd)/lib_temp -lferret -lm -ldl -lpthread"
          
          # 4. 强制不让 Go 自动下载 1.24，使用环境中的 1.22
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: quilibrium-binary
          path: node/qnode-linux-amd64
