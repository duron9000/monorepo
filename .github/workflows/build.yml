name: Remote Build Quilibrium Node (Auto-Path)

on:
  workflow_dispatch:

jobs:
  build-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Original Repository
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build Quilibrium Node
        run: |
          # 1. 查找 libferret.a 文件的真实位置
          # 这样无论官方把它放在 node/lib 还是 node/lib/linux-amd64 都能找到
          LIB_PATH=$(find . -name "libferret.a" -exec dirname {} + | head -n 1)
          ABS_LIB_PATH=$(pwd)/${LIB_PATH#./}
          
          echo "Found libferret.a at: $ABS_LIB_PATH"
          
          # 2. 进入 node 目录进行编译
          cd node
          
          # 3. 设置 CGO 环境
          export CGO_ENABLED=1
          
          # 4. 动态设置链接路径
          # 我们把找到的绝对路径传给 LDFLAGS
          export CGO_LDFLAGS="-L$ABS_LIB_PATH -lferret -lm -ldl -lpthread"
          
          echo "Starting build with LDFLAGS: $CGO_LDFLAGS"
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quilibrium-v2.1.0.18-linux
          path: node/qnode-linux-amd64
