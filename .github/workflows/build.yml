name: Quilibrium Build - Simple Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      # 1. 安装系统底层依赖
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config git libboost-all-dev

      # 2. 顺序安装 EMP-Toolkit (物理路径安装)
      - name: Install EMP Toolkit
        run: |
          # 安装 emp-tool
          rm -rf emp-tool-repo
          git clone https://github.com/emp-toolkit/emp-tool.git emp-tool-repo
          cd emp-tool-repo && cmake . -DBUILD_SHARED_LIBS=OFF && make -j$(nproc) && sudo make install && cd ..
          
          # 安装 emp-ot
          rm -rf emp-ot-repo
          git clone https://github.com/emp-toolkit/emp-ot.git emp-ot-repo
          cd emp-ot-repo && cmake . -DBUILD_SHARED_LIBS=OFF -DCMAKE_PREFIX_PATH=/usr/local && make -j$(nproc) && sudo make install && cd ..
          
          # 刷新库索引
          sudo ldconfig
          
          # 验证库文件存在
          echo "=== Checking installed libraries ==="
          ls -la /usr/local/lib/libemp*.a || echo "EMP libraries not found!"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. 修复 ferret build.rs - 添加库搜索路径
      - name: Patch ferret build.rs to add library search path
        run: |
          cd crates/ferret
          
          # 在 build.rs 文件的 main() 函数开始处添加搜索路径指令
          # 使用 Perl 在 'fn main()' 之后插入代码
          perl -i -pe 'if (/fn main\(\)/) { 
            $_ .= qq{    // Added by build patch: specify library search paths\n};
            $_ .= qq{    println!("cargo:rustc-link-search=native=/usr/local/lib");\n};
            $_ .= qq{    println!("cargo:rustc-link-lib=static=emp-tool");\n};
            $_ .= qq{    println!("cargo:rustc-link-lib=static=emp-ot");\n};
            $_ .= qq{\n};
          }' build.rs
          
          # 显示修改内容
          echo "=== Patched build.rs (first 30 lines) ==="
          head -n 30 build.rs

      # 4. 编译 Rust 静态库
      - name: Build Ferret Library
        run: |
          cd crates/ferret
          
          # 设置额外的环境变量帮助查找库
          export RUSTFLAGS="-L native=/usr/local/lib"
          export LIBRARY_PATH="/usr/local/lib:$LIBRARY_PATH"
          export LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          export CPATH="/usr/local/include"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"
          
          # 使用 verbose 模式查看详细编译信息
          cargo build --release --verbose
          
          mkdir -p ../../node/lib/linux-amd64/
          cp target/release/libferret.a ../../node/lib/linux-amd64/
          
          # 验证生成的库
          ls -lh ../../node/lib/linux-amd64/libferret.a

      # 5. 最终编译 Go 节点
      - name: Build Go Node
        run: |
          cd node
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -L/usr/local/lib -lferret -lemp-tool -lemp-ot -lssl -lcrypto -lm -ldl -lpthread -lstdc++"
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go
          
          # 验证生成的可执行文件
          ls -lh qnode-linux-amd64
          file qnode-linux-amd64

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: qnode-v2.1.0.18-standalone
          path: node/qnode-linux-amd64
