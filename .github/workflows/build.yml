name: Full Build Quilibrium (Final Linker Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'QuilibriumNetwork/monorepo'
          ref: 'v2.1.0.18'

      # 1. 安装系统依赖
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config git libboost-all-dev

      # 2. 安装 EMP-Toolkit (核心：确保生成 .a 静态库)
      - name: Install EMP-Toolkit
        run: |
          # 安装 emp-tool
          rm -rf emp-tool
          git clone https://github.com/emp-toolkit/emp-tool.git
          cd emp-tool && cmake . && make -j$(nproc) && sudo make install && cd ..
          
          # 安装 emp-ot
          rm -rf emp-ot
          git clone https://github.com/emp-toolkit/emp-ot.git
          cd emp-ot && cmake . && make -j$(nproc) && sudo make install && cd ..

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. 编译 Rust 静态库 (核心修复：增加库搜索路径)
      - name: Build Ferret Library
        run: |
          cd crates/ferret
          # 关键：告诉 Rust 编译器去 /usr/local/lib 找 emp-tool 和 emp-ot
          export LIBRARY_PATH="/usr/local/lib:$LIBRARY_PATH"
          export LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          export CPATH="/usr/local/include"
          
          cargo build --release
          
          mkdir -p ../../node/lib/linux-amd64/
          cp target/release/libferret.a ../../node/lib/linux-amd64/

      # 4. 编译 Go 节点
      - name: Build Go Node
        run: |
          cd node
          export CGO_ENABLED=1
          # 增加 -lemp-tool 链接，确保 Go 能找到底层 C++ 实现
          export CGO_LDFLAGS="-L$(pwd)/lib/linux-amd64 -L/usr/local/lib -lferret -lemp-tool -lssl -lcrypto -lm -ldl -lpthread -lstdc++"
          export GOTOOLCHAIN=local
          
          go mod download
          go build -v -o qnode-linux-amd64 main.go

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: quilibrium-v2.1.0.18-final
          path: node/qnode-linux-amd64
